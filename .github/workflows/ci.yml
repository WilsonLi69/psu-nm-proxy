name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libsystemd-dev systemd-dev \
            libgtest-dev libboost-dev \
            nlohmann-json3-dev \
            python3 python3-mako python3-yaml python3-inflection \
            git curl

      - name: Build and install sdbusplus
        run: |
          git clone https://github.com/openbmc/sdbusplus /tmp/sdbusplus
          git -C /tmp/sdbusplus checkout e053146c71db0b460ba778a6711f1f2e48537a54
          meson setup /tmp/sdbusplus/build /tmp/sdbusplus \
            --prefix=/usr/local \
            -Dtests=disabled -Dexamples=disabled
          sudo ninja -C /tmp/sdbusplus/build install
          sudo ldconfig

      - name: Build and test
        run: ./run-ci
